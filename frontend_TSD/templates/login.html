<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}{{ role|capitalize }} Login - Gurukul{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 450px;
        margin: 4rem auto;
        background: #fff;
        padding: 3rem;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .login-header h2 {
        color: #1e3c72;
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.8rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #1e3c72;
    }
    
    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: transform 0.3s;
    }
    
    .btn-submit:hover {
        transform: translateY(-2px);
    }
    
    .register-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #666;
    }
    
    .register-link a {
        color: #1e3c72;
        text-decoration: none;
        font-weight: 500;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <h2>{{ role|capitalize }} Login</h2>
        <p>Welcome back! Please login to continue.</p>
    </div>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn-submit">Login</button>
    </form>
    
    <div class="register-link">
        Don't have an account? <a href="{{ url_for('register', role=role) }}">Register here</a>
    </div>
</div>
{% endblock %}
